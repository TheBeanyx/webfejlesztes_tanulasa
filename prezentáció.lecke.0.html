<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Az Első Weboldalam</title>

    <style>
        /* Ez a STYLE rész: itt öltöztetjük fel az oldalt színekkel. */
        body {
            background-color: #f0f4f8; /* Világos szürkéskék háttér */
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            color: #005088; /* Sötétkék címsor */
        }
        p {
            color: #333333; /* Sötétszürke szöveg */
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Sikerült! Ez a főcímem.</h1>
    
    <p>Ez pedig egy bekezdés. A háttérszínt és a betűk színét fent, a head-en belüli style részben állítottam be.</p>

</body>
</html>
